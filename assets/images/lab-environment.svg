      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.02" />
    </linearGradient>
  </defs>
  <rect width="500" height="380" fill="url(#labBg)" />
  
  <!-- Modern Computer Lab Illustration -->
  <!-- Desk Row 1 -->
  <path d="M 40 260 L 460 260 L 480 300 L 20 300 Z" fill="#334155" opacity="0.8"/>
  
  <!-- Monitor 1 -->
  <rect x="70" y="160" width="100" height="70" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <rect x="76" y="166" width="88" height="58" rx="3" fill="#0F172A"/>
  <path d="M 82 178 L 110 178 M 82 188 L 130 188 M 82 198 L 100 198" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <rect x="110" y="230" width="20" height="20" fill="#475569"/>
  <rect x="95" y="250" width="50" height="6" rx="2" fill="#64748B"/>
  
  <!-- Monitor 2 -->
  <rect x="200" y="150" width="100" height="70" rx="6" fill="#1E293B" stroke="#EF6126" stroke-width="2"/>
  <rect x="206" y="156" width="88" height="58" rx="3" fill="#0F172A"/>
  <path d="M 212 168 L 240 168 M 212 178 L 270 178 M 212 188 L 250 188 M 212 198 L 230 198" stroke="#EF6126" stroke-width="2" stroke-linecap="round"/>
