<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="pracBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="500" height="380" fill="url(#pracBg)" />
  
  <!-- Hands-on Lab Scenario -->
  <rect x="70" y="70" width="360" height="230" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  
  <!-- Tally & Code Split Screen Graphic -->
  <rect x="90" y="90" width="150" height="190" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <rect x="90" y="90" width="150" height="28" rx="8" fill="#10B981" fill-opacity="0.2"/>
  <text x="102" y="108" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="700">TallyPrime GST Ledger</text>
  <line x1="102" y1="130" x2="228" y2="130" stroke="#334155" stroke-width="1.5"/>
  <line x1="102" y1="150" x2="200" y2="150" stroke="#334155" stroke-width="1.5"/>
  <line x1="102" y1="170" x2="215" y2="170" stroke="#334155" stroke-width="1.5"/>
  <line x1="102" y1="190" x2="180" y2="190" stroke="#334155" stroke-width="1.5"/>
  <rect x="102" y="215" width="126" height="30" rx="4" fill="rgba(16,185,129,0.15)" stroke="#10B981"/>
  <text x="165" y="234" fill="#34D399" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Balance Sheet Verified</text>

  <!-- Right Split: Programming Compiler -->
  <rect x="260" y="90" width="150" height="190" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <rect x="260" y="90" width="150" height="28" rx="8" fill="#EF6126" fill-opacity="0.2"/>
  <text x="272" y="108" fill="#EF6126" font-family="'Inter', sans-serif" font-size="11" font-weight="700">C++ / Java DSA Code</text>
  <line x1="272" y1="130" x2="380" y2="130" stroke="#60A5FA" stroke-width="1.5"/>
  <line x1="272" y1="150" x2="350" y2="150" stroke="#F472B6" stroke-width="1.5"/>
  <line x1="272" y1="170" x2="390" y2="170" stroke="#FBBF24" stroke-width="1.5"/>
  <line x1="272" y1="190" x2="330" y2="190" stroke="#34D399" stroke-width="1.5"/>
  <rect x="272" y="215" width="126" height="30" rx="4" fill="rgba(239,97,38,0.15)" stroke="#EF6126"/>
  <text x="335" y="234" fill="#F97316" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">0 Errors • Output OK</text>

  <!-- Overlay Badge -->
  <rect x="20" y="20" width="160" height="32" rx="6" fill="rgba(15, 23, 42, 0.75)" stroke="#334155"/>
  <circle cx="36" cy="36" r="5" fill="#10B981"/>
  <text x="50" y="40" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Hands-on Exercises</text>
