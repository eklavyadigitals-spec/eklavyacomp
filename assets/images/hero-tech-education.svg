      <text x="135" y="40" fill="#9CA3AF" font-family="monospace" font-size="13">,</text>
      <text x="148" y="40" fill="#34D399" font-family="monospace" font-size="13">"Data Structures"</text>
      <text x="282" y="40" fill="#9CA3AF" font-family="monospace" font-size="13">,</text>
      <text x="295" y="40" fill="#34D399" font-family="monospace" font-size="13">".NET"</text>
      <text x="340" y="40" fill="#F3F4F6" font-family="monospace" font-size="13">];</text>

