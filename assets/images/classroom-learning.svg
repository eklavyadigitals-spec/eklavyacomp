<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="classBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="500" height="380" fill="url(#classBg)" />
  
  <!-- Interactive Whiteboard / Smart Display -->
  <rect x="80" y="50" width="340" height="190" rx="10" fill="#0F172A" stroke="#475569" stroke-width="3" />
  
  <!-- Diagram on screen -->
  <circle cx="160" cy="130" r="28" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="160" y="135" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Logic</text>
  
  <line x1="188" y1="130" x2="232" y2="130" stroke="#64748B" stroke-width="2" stroke-dasharray="4"/>
  
  <circle cx="260" cy="130" r="28" fill="#1E293B" stroke="#EF6126" stroke-width="2"/>
  <text x="260" y="135" fill="#EF6126" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Code</text>

  <line x1="288" y1="130" x2="332" y2="130" stroke="#64748B" stroke-width="2" stroke-dasharray="4"/>

  <circle cx="360" cy="130" r="28" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <text x="360" y="135" fill="#10B981" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Result</text>

  <text x="250" y="195" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Structured Concept &amp; Practical Problem Solving</text>

  <!-- Faculty & Student silhouettes / Classroom context -->
  <path d="M 60 330 C 60 280, 110 280, 110 330 Z" fill="#334155"/>
  <circle cx="85" cy="265" r="15" fill="#475569"/>

  <path d="M 180 340 C 180 290, 230 290, 230 340 Z" fill="#334155"/>
  <circle cx="205" cy="275" r="15" fill="#475569"/>

  <path d="M 300 340 C 300 290, 350 290, 350 340 Z" fill="#334155"/>
  <circle cx="325" cy="275" r="15" fill="#475569"/>

  <!-- Overlay Badge -->
  <rect x="20" y="20" width="160" height="32" rx="6" fill="rgba(15, 23, 42, 0.75)" stroke="#334155"/>
  <circle cx="36" cy="36" r="5" fill="#38BDF8"/>
  <text x="50" y="40" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Classroom Instruction</text>
</svg>
